# npm channel. Run it manually: Actions → "Publish to npm" → Run workflow, entering an existing tag (e.g. v0.0.1).
# It is independent of the GitHub Release and GitHub Packages channels.
# If the version is already on npm, the publish step is skipped.
#
# Auth — pick one:
#   A. Trusted publishing (recommended, no secret): on npmjs.com → package → Settings →
#      Trusted Publisher → GitHub Actions, repo = <owner>/<repo>, workflow = publish-npm.yml.
#      (The package must exist first: do the very first publish locally.)
#   B. Token: add an npm "Automation"/granular token as the repo secret NPM_TOKEN.
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v1.2.3'
        required: true

concurrency:
  group: publish-npm-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10 # package.json has no `packageManager` field, so pin the pnpm major here
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json
        id: meta
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"; exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            ID=$(echo "$VERSION" | sed -E 's/^[^-]+-([a-zA-Z]+).*/\1/'); [[ "$ID" =~ ^[a-zA-Z]+$ ]] || ID=next
            echo "tag=$ID" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm run check
        if: steps.meta.outputs.published == 'false'
      - run: node scripts/smoke.mjs --no-build
        if: steps.meta.outputs.published == 'false'

      - name: Publish
        if: steps.meta.outputs.published == 'false'
        run: |
          NAME=$(node -p "require('./package.json').name"); VERSION=$(node -p "require('./package.json').version")
          for attempt in 1 2 3; do
            if npm publish --provenance --access public --tag ${{ steps.meta.outputs.tag }} --ignore-scripts; then exit 0; fi
            # The upload may have landed even though the client errored — re-check before retrying.
            for i in 1 2 3 4 5 6; do
              sleep 10
              if [ "$(npm view "$NAME@$VERSION" version --prefer-online 2>/dev/null)" = "$VERSION" ]; then
                echo "$NAME@$VERSION is on npm — treating as published."; exit 0
              fi
            done
            echo "::warning::publish attempt $attempt failed, retrying"
          done
          echo "::error::npm publish failed. Common causes: Trusted Publisher not configured (or workflow name mismatch), NPM_TOKEN missing/expired, no publish rights on the scope, version previously unpublished."
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
